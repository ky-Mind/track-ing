<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LokasiBareng</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root{
    --bg:#f4f6fb; --bg2:#ffffff; --panel:#ffffff; --fg:#141a2a; --muted:#64708c;
    --line:#e3e8f2; --accent:#3a6ff0; --accent-weak:#eaf0ff;
    --ok:#12a978; --warn:#e08a00; --danger:#e0435f;
    --shadow:0 10px 30px rgba(30,45,90,.10); --r:4px;
    color-scheme:light;
  }
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0e121d; --bg2:#141a29; --panel:#161d2e; --fg:#eef1f8; --muted:#97a2bd;
    --line:#28314c; --accent:#5a8bff; --accent-weak:#1b2748;
    --ok:#22c48d; --warn:#f0a93a; --danger:#ff5f78;
    --shadow:0 14px 40px rgba(0,0,0,.45); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0e121d; --bg2:#141a29; --panel:#161d2e; --fg:#eef1f8; --muted:#97a2bd;
    --line:#28314c; --accent:#5a8bff; --accent-weak:#1b2748;
    --ok:#22c48d; --warn:#f0a93a; --danger:#ff5f78;
    --shadow:0 14px 40px rgba(0,0,0,.45); color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,select,textarea{font:inherit}
  .icon{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

  /* ---- shell ---- */
  .app{display:grid;grid-template-columns:380px 1fr;grid-template-rows:56px 1fr;height:100%;
    grid-template-areas:"bar bar" "side map"}
  .bar{grid-area:bar;display:flex;align-items:center;gap:10px;padding:0 16px;
    background:var(--bg2);border-bottom:1px solid var(--line);z-index:30}
  .bar .logo{font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;font-size:16px}
  .bar .pin{width:26px;height:26px;border-radius:4px;background:var(--accent);display:grid;place-items:center;color:#fff}
  .bar .sub{color:var(--muted);font-size:12px}
  .bar .spacer{flex:1}
  .iconbtn{width:38px;height:38px;border-radius:4px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
  .iconbtn:hover{background:var(--bg);color:var(--fg)}

  .side{grid-area:side;background:var(--bg2);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  .side .pad{padding:14px 16px}
  .search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);
    border-radius:4px;padding:9px 12px;color:var(--muted)}
  .search input{border:0;background:none;outline:none;color:var(--fg);width:100%}
  .newbtn{width:100%;margin-top:10px;background:var(--accent);color:#fff;border-radius:4px;
    padding:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
  .newbtn:active{transform:translateY(1px)}
  .list{flex:1;overflow:auto;padding:4px 12px 90px;min-height:0}
  .map{grid-area:map;position:relative;z-index:0}
  #map{position:absolute;inset:0}
  .leaflet-container{background:var(--bg);font:inherit}

  /* ---- contact card ---- */
  .card{display:flex;gap:11px;padding:12px;border:1px solid var(--line);border-radius:4px;
    background:var(--panel);margin-bottom:9px;cursor:pointer;transition:border-color .15s,transform .05s}
  .card:hover{border-color:var(--accent)}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .card:active{transform:translateY(1px)}
  .avatar{width:38px;height:38px;border-radius:4px;display:grid;place-items:center;color:#fff;
    font-weight:800;flex:0 0 auto;font-size:15px}
  .card .mid{flex:1;min-width:0}
  .card .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .reason{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .foot{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
  .pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:3px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
  .pill.live{background:rgba(18,169,120,.15);color:var(--ok)}
  .pill.waiting{background:rgba(224,138,0,.15);color:var(--warn)}
  .pill.shared,.pill.done{background:var(--accent-weak);color:var(--accent)}
  .pill.expired,.pill.inactive{background:var(--line);color:var(--muted)}
  .pill.revoked{background:rgba(224,67,95,.15);color:var(--danger)}
  .dotlive{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .ago{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
  .empty svg{width:40px;height:40px;opacity:.4;margin-bottom:10px}

  /* ---- sheet / modal ---- */
  .scrim{position:fixed;inset:0;background:rgba(10,14,24,.5);backdrop-filter:blur(2px);
    z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
  .scrim.open{display:flex}
  .sheet{background:var(--bg2);border:1px solid var(--line);border-radius:4px;width:100%;max-width:440px;
    max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
  .sheet .head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--bg2);z-index:1}
  .sheet .head h2{font-size:16px;margin:0;flex:1}
  .sheet .body{padding:18px}
  label.fld{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px;font-weight:600}
  label.fld:first-child{margin-top:0}
  .inp,textarea.inp,select.inp{width:100%;background:var(--bg);border:1px solid var(--line);
    border-radius:4px;color:var(--fg);padding:12px;outline:none}
  .inp:focus,select.inp:focus,textarea.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
  textarea.inp{resize:vertical;min-height:56px}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .swatches{display:flex;gap:9px;flex-wrap:wrap}
  .sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .sw.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg2) inset}
  .seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px;gap:3px}
  .seg button{flex:1;padding:9px;border-radius:4px;font-weight:600;color:var(--muted);font-size:13.5px}
  .seg button.on{background:var(--accent);color:#fff}
  .primary{width:100%;background:var(--accent);color:#fff;border-radius:4px;padding:13px;font-weight:700;margin-top:18px;
    display:flex;align-items:center;justify-content:center;gap:8px}
  .primary:active{transform:translateY(1px)}
  .ghostbtn{border:1px solid var(--line);border-radius:4px;padding:11px;font-weight:600;color:var(--fg);
    display:flex;align-items:center;justify-content:center;gap:7px;width:100%}
  .ghostbtn:hover{background:var(--bg)}
  .ghostbtn.danger{color:var(--danger)}

  /* detail */
  .dhead{display:flex;align-items:center;gap:12px}
  .qrwrap{background:#fff;padding:14px;border-radius:4px;display:grid;place-items:center;margin:6px auto 0;width:max-content}
  .qrwrap img,.qrwrap canvas{display:block}
  .linkpill{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);
    border-radius:4px;padding:10px 12px;margin-top:12px}
  .linkpill code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--muted)}
  .sharegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
  .share{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);
    border-radius:4px;padding:11px;font-weight:600;text-decoration:none;color:var(--fg)}
  .share.wa{color:#fff;background:#25d366;border-color:transparent}
  .share.tg{color:#fff;background:#2aabee;border-color:transparent}
  .infoline{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .infoline .k{color:var(--muted)}
  .infoline:last-of-type{border-bottom:0}
  .btns2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}

  /* toast */
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:3px;font-weight:600;font-size:13.5px;
    opacity:0;transition:.25s;z-index:2000;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* mobile bottom nav */
  .bottomnav{display:none}
  @media(max-width:820px){
    body{overflow:auto}
    .app{grid-template-columns:1fr;grid-template-rows:52px 1fr;grid-template-areas:"bar" "stack";height:100dvh}
    .side{grid-area:stack;border-right:0;z-index:10}
    .map{grid-area:stack}
    .side,.map{min-height:0}
    .app[data-view="map"] .side{display:none}
    .app[data-view="list"] .map{display:none}
    .list{padding-bottom:76px}
    .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg2);
      border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));}
    .bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px;
      color:var(--muted);font-size:11px;font-weight:600;border-radius:4px}
    .bottomnav button.on{color:var(--accent)}
    .sheet{max-width:none;max-height:none;min-height:100dvh;border-radius:0;border:0}
    .scrim{padding:0;align-items:stretch}
  }
</style>
</head>
<body>
  <div class="app" id="app" data-view="list">
    <div class="bar">
      <div class="logo"><span class="pin"><svg class="icon" viewBox="0 0 24 24"><path d="M12 21s-7-5.2-7-11a7 7 0 1 1 14 0c0 5.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
        LokasiBareng</div>
      <span class="sub">· berbasis izin</span>
      <span class="spacer"></span>
      <button class="iconbtn" id="themeBtn" title="Ganti tema" aria-label="Ganti tema">
        <svg class="icon" id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
      <button class="iconbtn" id="logoutBtn" title="Keluar" aria-label="Keluar">
        <svg class="icon" viewBox="0 0 24 24"><path d="M15 12H3m0 0 4-4m-4 4 4 4M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/></svg>
      </button>
    </div>

    <div class="side">
      <div class="pad">
        <div class="search">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" placeholder="Cari nama, catatan, alasan…">
        </div>
        <button class="newbtn" id="newBtn">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Buat link baru
        </button>
      </div>
      <div class="list" id="list"></div>
    </div>

    <div class="map"><div id="map"></div></div>

    <nav class="bottomnav">
      <button data-nav="list" class="on">
        <svg class="icon" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Kontak</button>
      <button data-nav="map">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9 18 3 20V6l6-2 6 2 6-2v14l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Peta</button>
    </nav>
  </div>

  <!-- CREATE SHEET -->
  <div class="scrim" id="createScrim">
    <div class="sheet">
      <div class="head"><h2>Buat link berbagi</h2><button class="iconbtn" data-close><svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="body">
        <label class="fld">Untuk siapa — nama / no. HP / email / @ig (penanda)</label>
        <input class="inp" id="c_label" placeholder="mis. Budi — 0812xxxx / @budi" maxlength="120">
        <label class="fld">Alasan (ditampilkan ke orangnya)</label>
        <input class="inp" id="c_reason" placeholder="mis. Konfirmasi titik COD" maxlength="200">
        <label class="fld">Catatan pribadi (opsional, hanya kamu yang lihat)</label>
        <input class="inp" id="c_note" placeholder="mis. Pembeli Shopee, warna merah" maxlength="300">
        <label class="fld">Warna</label>
        <div class="swatches" id="c_swatches"></div>
        <div class="row" style="margin-top:14px">
          <div><label class="fld" style="margin-top:0">Mode</label>
            <div class="seg" id="c_mode">
              <button data-mode="live" class="on">Live terus</button>
              <button data-mode="once">Sekali</button>
            </div></div>
          <div><label class="fld" style="margin-top:0">Berlaku</label>
            <select class="inp" id="c_ttl">
              <option value="60">1 jam</option>
              <option value="360">6 jam</option>
              <option value="1440">24 jam</option>
              <option value="0">Tanpa batas</option>
            </select></div>
        </div>
        <button class="primary" id="c_submit"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg> Buat & bagikan</button>
      </div>
    </div>
  </div>

  <!-- DETAIL SHEET -->
  <div class="scrim" id="detailScrim">
    <div class="sheet">
      <div class="head"><h2 id="d_title">Detail</h2><button class="iconbtn" data-close><svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="body" id="d_body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const COLORS = ["#3a6ff0","#12a978","#e0435f","#e08a00","#8b5cf6","#0ea5e9","#ec4899","#64708c"];
let state = { requests:[], sel:null, trailLayer:null, markers:{}, skew:0, mode:"live", color:COLORS[0], theme:null };

/* ---------- tema ---------- */
try{ state.theme = localStorage.getItem("lb-theme"); }catch(e){}
function applyTheme(){
  if(state.theme) document.documentElement.setAttribute("data-theme", state.theme);
  else document.documentElement.removeAttribute("data-theme");
  const dark = state.theme==="dark" || (!state.theme && matchMedia("(prefers-color-scheme:dark)").matches);
  $("#themeIcon").innerHTML = dark
    ? '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>'
    : '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>';
}
$("#themeBtn").onclick = ()=>{
  const dark = state.theme==="dark" || (!state.theme && matchMedia("(prefers-color-scheme:dark)").matches);
  state.theme = dark ? "light" : "dark";
  try{ localStorage.setItem("lb-theme", state.theme); }catch(e){}
  applyTheme();
};
applyTheme();

/* ---------- toast ---------- */
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1800); }
function copy(text){ navigator.clipboard?.writeText(text).then(()=>toast("Tersalin ✓"),()=>toast("Gagal menyalin")); }

/* ---------- peta ---------- */
const map = L.map("map",{zoomControl:true}).setView([-2.5,118],4);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap",maxZoom:19}).addTo(map);
function dotIcon(color){ return L.divIcon({className:"",html:`<div style="width:18px;height:18px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4)"></div>`,iconSize:[18,18],iconAnchor:[9,9]}); }

/* ---------- util ---------- */
function ago(ts){ const s=Math.floor((Date.now()+state.skew-ts)/1000);
  if(s<60) return s+" dtk lalu"; if(s<3600) return Math.floor(s/60)+" mnt lalu";
  if(s<86400) return Math.floor(s/3600)+" jam lalu"; return Math.floor(s/86400)+" hr lalu"; }
function expLabel(r){ if(!r.expiresAt) return "Tanpa batas";
  const left=r.expiresAt-(Date.now()+state.skew); if(left<=0) return "Kedaluwarsa";
  const m=Math.floor(left/60000); if(m<60) return m+" mnt lagi"; const h=Math.floor(m/60); if(h<24) return h+" jam lagi"; return Math.floor(h/24)+" hr lagi"; }
const STAT={ live:["● live","live"],waiting:["Menunggu klik","waiting"],shared:["Terakhir dibagikan","shared"],
  done:["Selesai (sekali)","done"],expired:["Kedaluwarsa","expired"],inactive:["Dimatikan","inactive"],revoked:["Izin ditarik","revoked"] };
function pill(st){ const[txt,cls]=STAT[st]||["?","inactive"]; const dot=st==="live"?'<span class="dotlive"></span>':''; return `<span class="pill ${cls}">${dot}${txt}</span>`; }
function initials(s){ return (s.trim()[0]||"?").toUpperCase(); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- list ---------- */
function render(){
  const q = $("#search").value.trim().toLowerCase();
  const items = state.requests.filter(r=> !q || (r.label+" "+r.note+" "+r.reason).toLowerCase().includes(q));
  const list = $("#list");
  if(!state.requests.length){ list.innerHTML = emptyState("Belum ada link","Buat link pertama, kirim ke orangnya, lokasinya muncul di sini setelah dia setuju."); updateMarkers(); return; }
  if(!items.length){ list.innerHTML = emptyState("Tidak ketemu","Coba kata kunci lain."); return; }
  list.innerHTML = items.map(r=>{
    const loc=r.lastLocation;
    return `<div class="card ${state.sel===r.id?'sel':''}" data-id="${r.id}">
      <div class="avatar" style="background:${r.color}">${initials(r.label)}</div>
      <div class="mid">
        <div class="name">${esc(r.label)}</div>
        <div class="reason">${esc(r.note||r.reason)}</div>
        <div class="foot">${pill(r.status)}${loc?`<span class="ago">${ago(loc.at)}</span>`:''}</div>
      </div>
    </div>`;
  }).join("");
  $$(".card",list).forEach(c=>c.onclick=()=>openDetail(c.dataset.id));
  updateMarkers();
}
function emptyState(t,s){ return `<div class="empty"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.5"><path d="M12 21s-7-5.2-7-11a7 7 0 1 1 14 0c0 5.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><div style="font-weight:700;color:var(--fg);margin-bottom:4px">${t}</div>${s}</div>`; }

function updateMarkers(){
  const seen={};
  state.requests.forEach(r=>{ const loc=r.lastLocation; if(!loc) return; seen[r.id]=1;
    if(state.markers[r.id]) state.markers[r.id].setLatLng([loc.lat,loc.lng]).setIcon(dotIcon(r.color));
    else state.markers[r.id]=L.marker([loc.lat,loc.lng],{icon:dotIcon(r.color)}).addTo(map).on("click",()=>openDetail(r.id));
    state.markers[r.id].bindTooltip(r.label,{direction:"top",offset:[0,-10]});
  });
  Object.keys(state.markers).forEach(id=>{ if(!seen[id]){ map.removeLayer(state.markers[id]); delete state.markers[id]; } });
}

/* ---------- create ---------- */
function buildSwatches(){ $("#c_swatches").innerHTML = COLORS.map((c,i)=>`<div class="sw ${i===0?'on':''}" data-c="${c}" style="background:${c}"></div>`).join("");
  $$("#c_swatches .sw").forEach(s=>s.onclick=()=>{ $$("#c_swatches .sw").forEach(x=>x.classList.remove("on")); s.classList.add("on"); state.color=s.dataset.c; }); }
$$("#c_mode button").forEach(b=>b.onclick=()=>{ $$("#c_mode button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); state.mode=b.dataset.mode; });
function openCreate(){ $("#c_label").value=""; $("#c_reason").value=""; $("#c_note").value=""; state.color=COLORS[0]; state.mode="live";
  buildSwatches(); $$("#c_mode button").forEach((x,i)=>x.classList.toggle("on",i===0)); $("#c_ttl").value="60";
  $("#createScrim").classList.add("open"); setTimeout(()=>$("#c_label").focus(),50); }
$("#newBtn").onclick=openCreate;
$("#c_submit").onclick=()=>{
  const label=$("#c_label").value.trim(); if(!label){ $("#c_label").focus(); toast("Isi dulu untuk siapa"); return; }
  fetch("/api/requests",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({label,reason:$("#c_reason").value.trim(),note:$("#c_note").value.trim(),
      color:state.color,mode:state.mode,ttlMinutes:Number($("#c_ttl").value)})})
   .then(r=>r.json()).then(({id})=>{ $("#createScrim").classList.remove("open");
     refresh().then(()=>openDetail(id,true)); });
};

/* ---------- detail ---------- */
function openDetail(rid,justCreated){
  fetch(`/api/requests/${rid}`).then(r=>r.ok?r.json():Promise.reject()).then(r=>{
    state.sel=rid; render();
    const url = `${location.origin}/t/${r.id}`;
    $("#d_title").textContent = r.label;
    $("#d_body").innerHTML = `
      <div class="dhead">
        <div class="avatar" style="width:46px;height:46px;background:${r.color};font-size:18px">${initials(r.label)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700">${esc(r.label)}</div>
          <div style="color:var(--muted);font-size:13px">${esc(r.reason)}</div>
        </div>${pill(r.status)}
      </div>
      ${justCreated?'<div style="background:var(--accent-weak);color:var(--accent);border-radius:4px;padding:10px 12px;margin-top:14px;font-size:13px;font-weight:600">Link siap! Scan QR atau bagikan di bawah.</div>':''}
      <div class="qrwrap" id="qr"></div>
      <div class="linkpill"><code>${esc(url)}</code>
        <button class="iconbtn" id="copyLink" style="width:32px;height:32px"><svg class="icon" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button></div>
      <div class="sharegrid">
        <a class="share wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(shareText(r,url))}"><svg class="icon" viewBox="0 0 24 24"><path d="M3 21l1.6-4A8.5 8.5 0 1 1 12 20.5 8.4 8.4 0 0 1 7.8 19.4z"/></svg>WhatsApp</a>
        <a class="share tg" target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(shareText(r,""))}"><svg class="icon" viewBox="0 0 24 24"><path d="M22 3 2 10.5l6 2M22 3l-3 16-7-4.5M22 3 8.5 14.5M8 12.5V18l3-3.3"/></svg>Telegram</a>
      </div>

      <div style="margin-top:18px">
        <div class="infoline"><span class="k">Status</span><span>${STAT[r.status][0]}</span></div>
        <div class="infoline"><span class="k">Mode</span><span>${r.mode==="once"?"Sekali kirim":"Live terus"}</span></div>
        <div class="infoline"><span class="k">Berlaku</span><span>${expLabel(r)}</span></div>
        <div class="infoline"><span class="k">Titik lokasi</span><span>${r.points} ${r.points?`· ${r.lastLocation?ago(r.lastLocation.at):''}`:''}</span></div>
        ${r.lastLocation?`<div class="infoline"><span class="k">Koordinat</span><span style="font-variant-numeric:tabular-nums">${r.lastLocation.lat.toFixed(5)}, ${r.lastLocation.lng.toFixed(5)}</span></div>`:''}
      </div>

      <label class="fld">Catatan pribadi</label>
      <textarea class="inp" id="d_note" placeholder="Catatan untukmu…">${esc(r.note||"")}</textarea>

      <div class="btns2" style="margin-top:14px">
        ${r.lastLocation?`<button class="ghostbtn" id="d_route"><svg class="icon" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h6a4 4 0 0 0 0-8H9a4 4 0 0 1 0-8h5"/></svg>Lihat rute</button>
          <a class="ghostbtn" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${r.lastLocation.lat},${r.lastLocation.lng}"><svg class="icon" viewBox="0 0 24 24"><path d="M12 21s-7-5.2-7-11a7 7 0 1 1 14 0c0 5.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Google Maps</a>`:''}
        <button class="ghostbtn" id="d_toggle">${r.active?'<svg class="icon" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="6"/><circle cx="16" cy="12" r="3" fill="currentColor"/></svg>Matikan link':'<svg class="icon" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="6"/><circle cx="8" cy="12" r="3" fill="currentColor"/></svg>Aktifkan'}</button>
        <button class="ghostbtn" id="d_extend"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>+1 jam</button>
        <button class="ghostbtn danger" id="d_del"><svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M6 7l1 13h10l1-13"/></svg>Hapus</button>
      </div>`;
    $("#detailScrim").classList.add("open");

    new QRCode($("#qr"),{text:url,width:150,height:150,colorDark:"#141a2a",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
    $("#copyLink").onclick=()=>copy(url);
    const note=$("#d_note"); let nt; note.oninput=()=>{ clearTimeout(nt); nt=setTimeout(()=>patch(rid,{note:note.value}),500); };
    const del=$("#d_del"); if(del) del.onclick=()=>{ if(del.dataset.c){ fetch(`/api/requests/${rid}`,{method:"DELETE"}).then(()=>{ closeAll(); refresh(); toast("Dihapus"); }); } else { del.dataset.c=1; del.innerHTML='<svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16"/></svg>Yakin hapus?'; } };
    const tg=$("#d_toggle"); if(tg) tg.onclick=()=>patch(rid,{active:!r.active}).then(()=>openDetail(rid));
    const ex=$("#d_extend"); if(ex) ex.onclick=()=>{ const base=r.expiresAt?Math.max(0,r.expiresAt-(Date.now()+state.skew)):0; patch(rid,{ttlMinutes:Math.round(base/60000)+60}).then(()=>{ openDetail(rid); toast("Diperpanjang 1 jam"); }); };
    const rt=$("#d_route"); if(rt) rt.onclick=()=>showRoute(r);
  }).catch(()=>toast("Gagal memuat"));
}
function shareText(r,url){ return `Hai! Aku minta lokasimu untuk: ${r.reason}. Klik & pilih "Bagikan" ya 🙏 ${url}`.trim(); }
function patch(rid,body){ return fetch(`/api/requests/${rid}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(r=>r.json()).then(()=>refresh()); }

/* rute di peta */
function showRoute(r){
  closeAll();
  fetch(`/api/requests/${r.id}/trail`).then(x=>x.json()).then(d=>{
    if(state.trailLayer){ map.removeLayer(state.trailLayer); state.trailLayer=null; }
    const pts=d.trail.map(p=>[p.lat,p.lng]);
    if(!pts.length){ toast("Belum ada titik"); return; }
    const grp=L.layerGroup();
    if(pts.length>1) L.polyline(pts,{color:r.color,weight:4,opacity:.85}).addTo(grp);
    L.circleMarker(pts[0],{radius:5,color:"#fff",weight:2,fillColor:r.color,fillOpacity:1}).bindTooltip("Awal").addTo(grp);
    L.marker(pts[pts.length-1],{icon:dotIcon(r.color)}).bindTooltip(r.label+" (terkini)",{direction:"top",offset:[0,-10]}).addTo(grp);
    grp.addTo(map); state.trailLayer=grp;
    map.fitBounds(L.latLngBounds(pts).pad(.3),{maxZoom:17});
    setView("map");
  });
}

/* ---------- navigasi & modal ---------- */
function closeAll(){ $$(".scrim").forEach(s=>s.classList.remove("open")); }
$$("[data-close]").forEach(b=>b.onclick=closeAll);
$$(".scrim").forEach(s=>s.onclick=e=>{ if(e.target===s) closeAll(); });
document.onkeydown=e=>{ if(e.key==="Escape") closeAll(); };
function setView(v){ $("#app").dataset.view=v; $$(".bottomnav button").forEach(b=>b.classList.toggle("on",b.dataset.nav===v)); if(v==="map") setTimeout(()=>map.invalidateSize(),60); }
$$(".bottomnav button").forEach(b=>b.onclick=()=>setView(b.dataset.nav));
$("#search").oninput=render;
$("#logoutBtn").onclick=()=>{ fetch("/api/logout",{method:"POST"}).then(()=>location.href="/"); };

/* ---------- loop refresh ---------- */
function refresh(){
  return fetch("/api/requests").then(r=>r.json()).then(d=>{
    if(d.serverTime) state.skew = d.serverTime - Date.now();
    state.requests=d.requests; render();
  }).catch(()=>{});
}
refresh();
setInterval(refresh,4000);
</script>
</body>
</html>
